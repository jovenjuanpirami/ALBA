<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #F5F2ED; }
  a { color: #A8702A; }
  a:hover { color: #1C1A17; }
</style>
</helmet>
<div style="font-family: Jost, Helvetica, sans-serif; color: #1C1A17; background: #F5F2ED; padding: 96px 72px; display: flex; flex-direction: column; gap: 96px;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(28,26,23,0.15); padding-bottom: 18px;">
    <div style="font-size: 15px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 400;">ALBA — Identity</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(28,26,23,0.5);">Dawn mark · v1</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 28px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(28,26,23,0.45);">01 — Primary lockup</div>
    <div style="background: #FFFDFA; border: 1px solid rgba(28,26,23,0.08); padding: 120px 64px; display: flex; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 34px;">
        <div style="width: 168px; height: 92px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <div style="width: 132px; height: 66px; border-radius: 132px 132px 0 0; background: linear-gradient(180deg, #E8A340 0%, #C9762B 100%);"></div>
          <div style="width: 168px; height: 3px; background: #1C1A17;"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <div style="font-size: 76px; font-weight: 300; letter-spacing: 0.34em; line-height: 1; text-indent: 0.34em;">ALBA</div>
          <div style="font-size: 14px; font-weight: 400; letter-spacing: 0.42em; color: rgba(28,26,23,0.55); text-indent: 0.42em;">NUTRITION</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 28px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(28,26,23,0.45);">02 — Horizontal lockup &amp; icon</div>
    <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px;">
      <div style="background: #FFFDFA; border: 1px solid rgba(28,26,23,0.08); padding: 72px 56px; display: flex; align-items: center; justify-content: center; gap: 32px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
          <div style="width: 62px; height: 31px; border-radius: 62px 62px 0 0; background: linear-gradient(180deg, #E8A340 0%, #C9762B 100%);"></div>
          <div style="width: 78px; height: 2px; background: #1C1A17;"></div>
        </div>
        <div style="width: 1px; height: 56px; background: rgba(28,26,23,0.14);"></div>
        <div style="font-size: 44px; font-weight: 300; letter-spacing: 0.3em; line-height: 1; text-indent: 0.3em;">ALBA</div>
      </div>
      <div style="background: #1C1A17; display: flex; align-items: center; justify-content: center; padding: 40px;">
        <div style="width: 176px; height: 176px; border-radius: 40px; background: #F5F2ED; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
          <div style="width: 92px; height: 46px; border-radius: 92px 92px 0 0; background: linear-gradient(180deg, #E8A340 0%, #C9762B 100%);"></div>
          <div style="width: 112px; height: 3px; background: #1C1A17;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 28px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(28,26,23,0.45);">03 — One colour</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
      <div style="background: #FFFDFA; border: 1px solid rgba(28,26,23,0.08); padding: 76px; display: flex; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 26px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
            <div style="width: 92px; height: 46px; border-radius: 92px 92px 0 0; background: #1C1A17;"></div>
            <div style="width: 116px; height: 2px; background: #1C1A17;"></div>
          </div>
          <div style="font-size: 46px; font-weight: 300; letter-spacing: 0.32em; line-height: 1; text-indent: 0.32em;">ALBA</div>
        </div>
      </div>
      <div style="background: #1C1A17; color: #F5F2ED; padding: 76px; display: flex; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 26px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
            <div style="width: 92px; height: 46px; border-radius: 92px 92px 0 0; background: #F5F2ED;"></div>
            <div style="width: 116px; height: 2px; background: #F5F2ED;"></div>
          </div>
          <div style="font-size: 46px; font-weight: 300; letter-spacing: 0.32em; line-height: 1; text-indent: 0.32em;">ALBA</div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 28px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(28,26,23,0.45);">04 — Small sizes &amp; palette</div>
    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px;">
      <div style="background: #FFFDFA; border: 1px solid rgba(28,26,23,0.08); padding: 56px; display: flex; align-items: flex-end; gap: 56px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 44px; height: 22px; border-radius: 44px 44px 0 0; background: linear-gradient(180deg, #E8A340 0%, #C9762B 100%);"></div>
            <div style="width: 56px; height: 2px; background: #1C1A17;"></div>
          </div>
          <div style="font-size: 20px; font-weight: 400; letter-spacing: 0.28em; text-indent: 0.28em;">ALBA</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <div style="width: 28px; height: 14px; border-radius: 28px 28px 0 0; background: linear-gradient(180deg, #E8A340 0%, #C9762B 100%);"></div>
            <div style="width: 36px; height: 1.5px; background: #1C1A17;"></div>
          </div>
          <div style="font-size: 13px; font-weight: 400; letter-spacing: 0.24em; text-indent: 0.24em;">ALBA</div>
        </div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(28,26,23,0.45); padding-bottom: 4px;">min. 13px wordmark</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr);">
        <div style="background: #E8A340; aspect-ratio: 1; display: flex; align-items: flex-end; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(28,26,23,0.7);">E8A340</div>
        <div style="background: #C9762B; aspect-ratio: 1; display: flex; align-items: flex-end; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,253,250,0.85);">C9762B</div>
        <div style="background: #F5F2ED; aspect-ratio: 1; display: flex; align-items: flex-end; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(28,26,23,0.6);">F5F2ED</div>
        <div style="background: #1C1A17; aspect-ratio: 1; display: flex; align-items: flex-end; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(245,242,237,0.7);">1C1A17</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
